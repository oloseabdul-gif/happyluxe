<!DOCTYPE html>  <html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>HAPPYLUXE | Luxury Fashion</title>  <meta
name="description"
content="HAPPYLUXE — Where tradition meets trend."

> 

  <style>  
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap');  
  
    :root {  
      --magenta: #a80d4a;  
      --deep-magenta: #75052f;  
      --pink: #ff69b4;  
      --light-pink: #ffd6e8;  
      --white: #ffffff;  
    }  
  
    * {  
      margin: 0;  
      padding: 0;  
      box-sizing: border-box;  
    }  
  
    body {  
      min-height: 100vh;  
      display: grid;  
      place-items: center;  
      overflow-x: hidden;  
      background: var(--white);  
      font-family: 'Cormorant Garamond', Georgia, serif;  
    }  
  
    /* Main logo container */  
  
    .logo {  
      width: min(92%, 700px);  
      display: flex;  
      flex-direction: column;  
      align-items: center;  
      text-align: center;  
      padding: 30px 20px;  
    }  
  
    /* Logo icon */  
  
    .logo-mark {  
      width: min(100%, 340px);  
      margin-bottom: -8px;  
      animation: iconEntrance 1.5s ease-out both;  
    }  
  
    .logo-mark svg {  
      display: block;  
      width: 100%;  
      height: auto;  
      overflow: visible;  
    }  
  
    /* Monogram */  
  
    .monogram {  
      font-family: 'Cormorant Garamond', Georgia, serif;  
      font-size: 205px;  
      font-weight: 500;  
      fill: url(#magenta);  
      stroke: #8f153f;  
      stroke-width: 0.7px;  
      paint-order: stroke fill;  
      transform-box: fill-box;  
      transform-origin: center;  
      animation: monogramReveal 1.5s ease-out both;  
    }  
  
    /* Pink flowing thread */  
  
    .pink-thread {  
      fill: none;  
      stroke: url(#threadPink);  
      stroke-width: 4;  
      stroke-linecap: round;  
      stroke-linejoin: round;  
  
      stroke-dasharray: 900;  
      stroke-dashoffset: 900;  
  
      animation:  
        threadDraw 2.8s ease-in-out 0.4s forwards,  
        threadGlow 4s ease-in-out 3.2s infinite;  
    }  
  
    /* Pink straight line */  
  
    .pink-line {  
      fill: none;  
      stroke: url(#threadPink);  
      stroke-width: 2;  
      stroke-linecap: round;  
  
      stroke-dasharray: 250;  
      stroke-dashoffset: 250;  
  
      animation: lineDraw 1.2s ease-out 2.3s forwards;  
    }  
  
    /* Brand name */  
  
    .brand-name {  
      font-family: 'Cormorant Garamond', Georgia, serif;  
      font-size: clamp(42px, 8vw, 76px);  
      font-weight: 500;  
      letter-spacing: 0.09em;  
      line-height: 1;  
      color: var(--magenta);  
      white-space: nowrap;  
  
      opacity: 0;  
      transform: translateY(18px);  
  
      animation: brandReveal 1.4s ease-out 1.8s forwards;  
    }  
  
    /* Pink divider */  
  
    .brand-divider {  
      width: 130px;  
      height: 1px;  
      background: var(--pink);  
      margin: 14px 0 10px;  
      position: relative;  
  
      transform: scaleX(0);  
      transform-origin: center;  
  
      animation: dividerReveal 1s ease-out 2.8s forwards;  
    }  
  
    .brand-divider::after {  
      content: '';  
      position: absolute;  
      width: 7px;  
      height: 7px;  
      background: var(--pink);  
      top: -3px;  
      left: 50%;  
      transform: translateX(-50%) rotate(45deg);  
    }  
  
    /* Tagline */  
  
    .brand-tagline {  
      font-family: Arial, sans-serif;  
      font-size: clamp(9px, 1.8vw, 12px);  
      font-weight: 400;  
      letter-spacing: 0.25em;  
      color: #6b535b;  
      line-height: 1.8;  
  
      opacity: 0;  
      transform: translateY(10px);  
  
      animation: taglineReveal 1.2s ease-out 3.2s forwards;  
    }  
  
    /* Icon entrance */  
  
    @keyframes iconEntrance {  
      0% {  
        opacity: 0;  
        transform: translateY(-25px) scale(0.88);  
      }  
  
      60% {  
        opacity: 1;  
        transform: translateY(5px) scale(1.02);  
      }  
  
      100% {  
        opacity: 1;  
        transform: translateY(0) scale(1);  
      }  
    }  
  
    /* Monogram reveal */  
  
    @keyframes monogramReveal {  
      0% {  
        opacity: 0;  
        filter: blur(8px);  
      }  
  
      100% {  
        opacity: 1;  
        filter: blur(0);  
      }  
    }  
  
    /* Thread drawing animation */  
  
    @keyframes threadDraw {  
      to {  
        stroke-dashoffset: 0;  
      }  
    }  
  
    /* Soft pink glow */  
  
    @keyframes threadGlow {  
      0%, 100% {  
        filter: drop-shadow(  
          0 0 1px rgba(255, 105, 180, 0.1)  
        );  
      }  
  
      50% {  
        filter: drop-shadow(  
          0 0 5px rgba(255, 105, 180, 0.45)  
        );  
      }  
    }  
  
    /* Straight line drawing */  
  
    @keyframes lineDraw {  
      to {  
        stroke-dashoffset: 0;  
      }  
    }  
  
    /* Brand name entrance */  
  
    @keyframes brandReveal {  
      to {  
        opacity: 1;  
        transform: translateY(0);  
      }  
    }  
  
    /* Divider entrance */  
  
    @keyframes dividerReveal {  
      to {  
        transform: scaleX(1);  
      }  
    }  
  
    /* Tagline entrance */  
  
    @keyframes taglineReveal {  
      to {  
        opacity: 1;  
        transform: translateY(0);  
      }  
    }  
  
    /* Responsive design */  
  
    @media (max-width: 480px) {  
      .logo {  
        padding: 20px 10px;  
      }  
  
      .logo-mark {  
        width: 95%;  
        margin-bottom: -5px;  
      }  
  
      .brand-name {  
        font-size: 10vw;  
        letter-spacing: 0.045em;  
      }  
  
      .brand-tagline {  
        letter-spacing: 0.15em;  
      }  
    }  
  
    /* Accessibility */  
  
    @media (prefers-reduced-motion: reduce) {  
      *,  
      *::before,  
      *::after {  
        animation-duration: 0.01ms !important;  
        animation-delay: 0ms !important;  
        animation-iteration-count: 1 !important;  
        transition-duration: 0.01ms !important;  
      }  
  
      .pink-thread {  
        stroke-dashoffset: 0;  
      }  
  
      .pink-line {  
        stroke-dashoffset: 0;  
      }  
  
      .brand-name,  
      .brand-tagline {  
        opacity: 1;  
        transform: none;  
      }  
  
      .brand-divider {  
        transform: scaleX(1);  
      }  
    }  
  </style>  </head>  <body>    <main class="logo">  <!-- HAPPYLUXE Monogram -->
